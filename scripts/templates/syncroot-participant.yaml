# Flux objects for participant __NAME__. Generated by scripts/add-participant.sh.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: __NAME__
  namespace: product-dis-training
spec:
  # Short interval: participants should see their push deployed within a minute or two.
  interval: 1m
  provider: azure
  url: oci://altinncr.azurecr.io/dis-training/__NAME__
  ref:
    tag: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: __NAME__
  namespace: product-dis-training
spec:
  # Short interval so drift (e.g. kubectl scale) is reverted within the lab.
  interval: 2m
  retryInterval: 1m
  # wait: Ready only when the participant's workloads are healthy, so a broken
  # deployment shows up in `flux get kustomizations` (used in the break-fix round).
  wait: true
  # Creating the identity and Key Vault in Azure takes a few minutes the first time.
  timeout: 5m
  path: ./overlays/aks
  prune: true
  sourceRef:
    kind: OCIRepository
    name: __NAME__
  targetNamespace: product-dis-training
