apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    # Created by the Vault operator as <vault-name>-secret-store. Kustomize doesn't know
    # this reference, so the prefixed name is written out in full.
    name: martivj-podinfo-secret-store
  target:
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: demo-api-key
