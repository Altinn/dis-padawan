apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: podinfo
    includeSelectors: true
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: podinfo-config
    literals:
      - PODINFO_UI_MESSAGE=Hello from <your name>
      - PODINFO_UI_COLOR=#c0392b
